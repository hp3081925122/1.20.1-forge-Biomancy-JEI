modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayTest = "IGNORE_ALL_VERSION"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "biomancy"
type = "required"
versionRange = "[2.9.11.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "jei"
type = "required"
versionRange = "[29.53.0.115,)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "biomancy_jei.mixins.json"

[[mixins]]
config = "biomancy_jei.emi.mixins.json"
requiredMods = ["emi"]
